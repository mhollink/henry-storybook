name: Release and Deploy
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: henry-production
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Deploy and Publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to master
        run: |
          git fetch origin master

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release commit must belong to master"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build
        run: pnpm verify
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

      - name: Generate release notes
        run: pnpm exec git-cliff --current --strip header --output RELEASE_NOTES.md

      - name: Deploy website using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /public_html/henry/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
